# python -m gft_subnet --config configs/testnet.example.yaml --chain test --wallet owner run-window --train ...
gym: guess_number
network: test
netuid: 572
base_model: Qwen/Qwen3-14B
# Rollouts per task (GRPO group). The validator deals them to miners by throughput.
group_size: 8
# Tasks per window; one GRPO step covers tasks_per_window * group_size rollouts.
tasks_per_window: 2
# Families the validator rotates through; each task uses the next unplayed seed.
families:
  - guess_16
  - guess_64
train_steps: 50
turn_timeout_seconds: 180
version_key: 0
device: cuda
confidential_compute: false
sampling:
  temperature: 1.2
  max_tokens: 256
